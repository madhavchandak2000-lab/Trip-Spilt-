name: Build Android APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          mkdir app
          unzip -o ./*.zip -d app
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        working-directory: app
        run: npm install
      - name: Create Android project
        working-directory: app
        run: npx cap add android
      - name: App icon
        working-directory: app
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp launcher/$d.png $RES/mipmap-$d/ic_launcher.png
            cp launcher/${d}_round.png $RES/mipmap-$d/ic_launcher_round.png
            rm -f $RES/mipmap-$d/ic_launcher_foreground.png
          done
      - name: Sync web assets
        working-directory: app
        run: npx cap sync android
      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TripSplit-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
